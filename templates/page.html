<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">

    <title>Predit</title>
  </head>
  <body>
    <div style="margin-bottom:25px;">
      <div class="container" >
      <nav class="navbar navbar-expand-lg navbar-light   sticky-top  justify-content-between"  >
        <a class="navbar-brand" style="font-size:30px"  href="#">CULTIVO</a>
        <form class="form-inline">
   </form>
      </nav>
    </div>
    </div>



    <div class="container" >
  <h2 style="padding:17px">Lets' Go</h2>
  <form class="form-horizontal" action="/predict" method="POST">
    <div class="form-group">
      <label class="control-label col-sm-2" for="email">Nitrogen(N):</label>
      <div class="col-sm-10">
        <input type="text" class="form-control" id="email" placeholder="Enter Nitrogen in 1mg/kg" name="nitrogen">
      </div>
    </div>
    <div class="form-group">
      <label class="control-label col-sm-2" for="pwd">Phosphorus(P):</label>
      <div class="col-sm-10">
        <input type="text" class="form-control" id="pwd" placeholder="Enter Phosphorus 1mg/kg" name="phosphorus">
      </div>
    </div>
    <div class="form-group">
      <label class="control-label col-sm-2" for="email">Potassium(K):</label>
      <div class="col-sm-10">
        <input type="text" class="form-control" id="email" placeholder="Enter potassium in 1mg/kg" name="Potassium">
      </div>
    </div>
    <div class="form-group">
      <label class="control-label col-sm-2" for="pwd">Temperature:</label>
      <div class="col-sm-10">
        <input type="text" class="form-control" id="pwd" placeholder="Enter Temperature in degree celsius" name="temperature">
      </div>
    </div>
    <div class="form-group">
      <label class="control-label col-sm-2" for="email">Humidity:</label>
      <div class="col-sm-10">
        <input type="text" class="form-control" id="email" placeholder="Enter Humidity in 	gm-3" name="humidity">
      </div>
    </div>
    <div class="form-group">
      <label class="control-label col-sm-2" for="pwd">pH:</label>
      <div class="col-sm-10">
        <input type="text" class="form-control" id="pwd" placeholder="Enter pH" name="pH">
      </div>
    </div>
    <div class="form-group">
      <label class="control-label col-sm-2" for="email">Rainfall:</label>
      <div class="col-sm-10">
        <input type="text" class="form-control" id="email" placeholder="Enter Rainfall millimeters (mm)" name="rainfall">
      </div>
    </div>
    <div class="form-group">
      <div class="col-sm-offset-2 col-sm-10">
        <div class="checkbox">
          <label><input type="checkbox" name="remember"> Entered details are verified</label>
        </div>
      </div>
    </div>
    <div class="form-group">
      <div class="col-sm-offset-2 col-sm-10">
        <button type="submit" class="btn btn-default">Predict</button>
      </div>
    </div>
  </form>
</div>



    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
  </body>
</html>
